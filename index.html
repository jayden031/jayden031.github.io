<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Cannon Game</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #F5E6D3;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .container {
    text-align: center;
  }
  #gameCanvas {
    background-color: #ECD9B0;
    display: block;
    margin: 20px auto;
    border: 3px solid #4B2E2E;
    border-radius: 10px;
    touch-action: none; /* Disable default scrolling gestures */
  }
  input, button {
    padding: 10px 15px;
    font-size: 16px;
    border-radius: 8px;
    border: 2px solid #4B2E2E;
    margin: 5px;
  }
  button {
    background-color: #4B2E2E;
    color: #F5E6D3;
    cursor: pointer;
  }
  button:hover {
    background-color: #3A1F1F;
  }
</style>
</head>
<body>

<div class="container" id="startScreen">
  <h1>Enter Your Name</h1>
  <input type="text" id="username" placeholder="Your Name">
  <button onclick="startGame()">Start</button>
</div>

<canvas id="gameCanvas" width="360" height="600" style="display:none;"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let cannon = { x: canvas.width / 2 - 25, y: canvas.height - 50, width: 50, height: 30 };
let bullets = [];
let items = [];
let score = 0;
let timeLeft = 30;
let username = '';
let gameLoopId;
let itemIntervalId;
let timerIntervalId;
let autoShootIntervalId;
let dragging = false;

function startGame() {
    username = document.getElementById('username').value.trim();
    if(!username) {
        alert("Please enter your name first!");
        return;
    }

    document.getElementById('startScreen').style.display = 'none';
    canvas.style.display = 'block';
    score = 0;
    bullets = [];
    items = [];
    timeLeft = 30;

    canvas.addEventListener('touchstart', startDrag);
    canvas.addEventListener('touchmove', dragCannon);
    canvas.addEventListener('touchend', endDrag);

    autoShootIntervalId = setInterval(shootBullet, 400);
    itemIntervalId = setInterval(spawnItem, 1000);
    timerIntervalId = setInterval(() => {
        timeLeft--;
        if(timeLeft <= 0) endGame();
    }, 1000);

    gameLoop();
}

// Mobile drag events
function startDrag(e) {
    dragging = true;
}
function dragCannon(e) {
    if(dragging) {
        const touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
        cannon.x = touchX - cannon.width / 2;
        // Keep cannon within bounds
        if(cannon.x < 0) cannon.x = 0;
        if(cannon.x + cannon.width > canvas.width) cannon.x = canvas.width - cannon.width;
        e.preventDefault();
    }
}
function endDrag(e) {
    dragging = false;
}

function shootBullet() {
    bullets.push({ x: cannon.x + cannon.width/2 - 5, y: cannon.y, width: 10, height: 20 });
}

function spawnItem() {
    let type = Math.random() < 0.5 ? 'good' : 'bomb';
    let x = Math.random() * (canvas.width - 30);
    items.push({ x, y: 0, width: 30, height: 30, type });
}

function checkCollision(a, b) {
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
}

function update() {
    // Move bullets
    bullets.forEach(b => b.y -= 8);
    bullets = bullets.filter(b => b.y + b.height > 0);

    // Move items
    items.forEach(i => i.y += 3);
    items = items.filter(i => i.y < canvas.height);

    // Check collisions
    bullets.forEach((b, bi) => {
        items.forEach((i, ii) => {
            if(checkCollision(b, i)) {
                if(i.type === 'good') score++;
                else if(i.type === 'bomb') score--;
                bullets.splice(bi,1);
                items.splice(ii,1);
            }
        });
    });
}

function draw() {
    ctx.clearRect(0,0,canvas.width, canvas.height);

    // Draw cannon
    ctx.fillStyle = "#4B2E2E";
    ctx.fillRect(cannon.x, cannon.y, cannon.width, cannon.height);

    // Draw bullets
    ctx.fillStyle = "#4B2E2E";
    bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

    // Draw items
    items.forEach(i => {
        ctx.fillStyle = i.type === 'good' ? "#8BC34A" : "#FF5252";
        ctx.fillRect(i.x, i.y, i.width, i.height);
    });

    // Draw score and timer
    ctx.fillStyle = "#4B2E2E";
    ctx.font = "18px Arial";
    ctx.fillText(`Player: ${username}`, 10, 20);
    ctx.fillText(`Score: ${score}`, 10, 40);
    ctx.fillText(`Time: ${timeLeft}s`, 10, 60);
}

function gameLoop() {
    update();
    draw();
    gameLoopId = requestAnimationFrame(gameLoop);
}

function endGame() {
    cancelAnimationFrame(gameLoopId);
    clearInterval(itemIntervalId);
    clearInterval(timerIntervalId);
    clearInterval(autoShootIntervalId);
    alert(`Time's up! ${username}, your final score is ${score}`);
    location.reload(); // Reload to play again
}
</script>
</body>
</html>
