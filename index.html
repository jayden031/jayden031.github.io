<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vico Game</title>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #F5E6D3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            overflow: hidden;
        }

        .container { text-align: center; }

        #gameCanvas {
            background-color: #ECD9B0;
            display: none;
            margin: 10px auto;
            border: 3px solid #4B2E2E;
            border-radius: 10px;
            touch-action: none;
        }

        input, button {
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #4B2E2E;
            margin: 5px;
        }

        button {
            background-color: #4B2E2E;
            color: #F5E6D3;
            font-weight: bold;
            cursor: pointer;
        }

        #leaderboard {
            margin-top: 20px;
            color: #4B2E2E;
            width: 300px;
        }
    </style>
</head>

<body>

<div class="container" id="startScreen">
    <h1>Vico Game</h1>
    <p>Hit green blocks, avoid red blocks!</p>
    <input type="text" id="usernameInput" placeholder="Enter Your Name">
    <br>
    <button id="startBtn">START GAME</button>
</div>

<canvas id="gameCanvas" width="360" height="600"></canvas>
<div id="leaderboard"></div>

<script>
// ===================== SUPABASE SETUP (FIXED) =====================
const SUPABASE_URL = "https://cbeiddwkqrpmvuaqmcgn.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNiZWlkZHdrcXJwbXZ1YXFtY2duIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MDE3MzUsImV4cCI6MjA5NDI3NzczNX0.YWWX2vmejo_vqL4PkgdnxfCtiEaNsh3KMY1LFOacJsM";

// create client immediately (FIXED)
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ===================== GAME VARIABLES =====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let cannon = { x: 155, y: 540, width: 50, height: 30 };
let bullets = [];
let items = [];
let score = 0;
let timeLeft = 30;
let username = '';
let gameActive = false;
let dragging = false;

let gameLoopId, itemIntervalId, timerIntervalId, autoShootIntervalId;

// ===================== EVENTS =====================
document.getElementById('startBtn').addEventListener('click', startGame);

// Touch controls
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    dragging = true;
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
    if (dragging) {
        const rect = canvas.getBoundingClientRect();
        const touchX = e.touches[0].clientX - rect.left;
        moveCannon(touchX);
    }
    e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchend', () => dragging = false);

function moveCannon(x) {
    cannon.x = x - cannon.width / 2;
    cannon.x = Math.max(0, Math.min(canvas.width - cannon.width, cannon.x));
}

// ===================== GAME =====================
function startGame() {
    const nameVal = document.getElementById('usernameInput').value.trim();

    if (!nameVal) {
        alert("Please enter your name!");
        return;
    }

    username = nameVal;

    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('leaderboard').innerHTML = "";
    canvas.style.display = 'block';

    score = 0;
    timeLeft = 30;
    bullets = [];
    items = [];
    gameActive = true;

    clearInterval(autoShootIntervalId);
    clearInterval(itemIntervalId);
    clearInterval(timerIntervalId);

    autoShootIntervalId = setInterval(shootBullet, 400);
    itemIntervalId = setInterval(spawnItem, 800);

    timerIntervalId = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) endGame();
    }, 1000);

    gameLoop();
}

function shootBullet() {
    bullets.push({
        x: cannon.x + cannon.width / 2 - 5,
        y: cannon.y,
        width: 10,
        height: 20
    });
}

function spawnItem() {
    let type = Math.random() < 0.7 ? 'good' : 'bomb';
    let x = Math.random() * (canvas.width - 30);

    items.push({
        x,
        y: -30,
        width: 30,
        height: 30,
        type
    });
}

function checkCollision(a, b) {
    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

// ===================== UPDATE =====================
function update() {
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= 7;
        if (bullets[i].y < -20) bullets.splice(i, 1);
    }

    for (let i = items.length - 1; i >= 0; i--) {
        items[i].y += 4;

        for (let j = bullets.length - 1; j >= 0; j--) {
            if (checkCollision(bullets[j], items[i])) {
                score += items[i].type === 'good' ? 1 : -1;
                bullets.splice(j, 1);
                items.splice(i, 1);
                break;
            }
        }

        if (items[i] && items[i].y > canvas.height) {
            items.splice(i, 1);
        }
    }
}

// ===================== DRAW =====================
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#4B2E2E";
    ctx.fillRect(cannon.x, cannon.y, cannon.width, cannon.height);

    bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

    items.forEach(i => {
        ctx.fillStyle = i.type === 'good' ? "#8BC34A" : "#FF5252";
        ctx.fillRect(i.x, i.y, i.width, i.height);
    });

    ctx.fillStyle = "#4B2E2E";
    ctx.font = "bold 16px Arial";
    ctx.fillText(`Player: ${username}`, 10, 25);
    ctx.fillText(`Score: ${score}`, 10, 50);
    ctx.fillText(`Time: ${timeLeft}s`, canvas.width - 90, 25);
}

// ===================== LOOP =====================
function gameLoop() {
    if (!gameActive) return;
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// ===================== END GAME =====================
async function endGame() {
    gameActive = false;

    clearInterval(autoShootIntervalId);
    clearInterval(itemIntervalId);
    clearInterval(timerIntervalId);

    alert(`Time's up! Your final score: ${score}`);

    await saveScore(username, score);
    await showLeaderboard();

    canvas.style.display = 'none';
    document.getElementById('startScreen').style.display = 'block';
}

// ===================== SUPABASE =====================
async function saveScore(name, score) {
    try {
        await supabaseClient.from('scores').insert([{ name, score }]);
    } catch (err) {
        console.error(err);
    }
}

async function showLeaderboard() {
    try {
        const { data } = await supabaseClient
            .from('scores')
            .select('name, score')
            .order('score', { ascending: false })
            .limit(5);

        if (data) {
            let html = "<h3>Top 5 Scores</h3><ol>";
            data.forEach(s => {
                html += `<li>${s.name}: ${s.score}</li>`;
            });
            html += "</ol>";

            document.getElementById("leaderboard").innerHTML = html;
        }
    } catch (err) {
        console.error(err);
    }
}
</script>

</body>
</html>
