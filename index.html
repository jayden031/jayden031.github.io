<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Page</title>
  <style>
    /* Reset some default styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #F5E6D3; /* Light brown background */
      color: #4B2E2E; /* Dark brown text */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: #ECD9B0; /* Slightly darker light brown for the container */
      padding: 30px 20px;
      border-radius: 15px;
      text-align: center;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 20px;
      font-size: 24px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #4B2E2E;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 16px;
    }

    input[type="text"]::placeholder {
      color: #7C5A4D;
    }

    button {
      background-color: #4B2E2E; /* Dark brown */
      color: #F5E6D3; /* Light brown text */
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #3A1F1F; /* Darker brown on hover */
    }

    @media (max-width: 400px) {
      h1 {
        font-size: 20px;
      }

      input[type="text"], button {
        font-size: 14px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome! Enter Your Name</h1>
    <input type="text" placeholder="Your name" id="username">
    <button onclick="startApp()">Start</button>
  </div>

  <script>
    function startApp() {
      const name = document.getElementById('username').value.trim();
      if(name) {
        alert(`Hello, ${name}! Let's get started!`);
      } else {
        alert("Please enter your name first.");
      }
    }
  </script>
</body>
</html>
