<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Cannon Game</title>
<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #F5E6D3;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    flex-direction: column;
  }
  .container {
    text-align: center;
  }
  #gameCanvas {
    background-color: #ECD9B0;
    display: none;
    margin: 20px auto;
    border: 3px solid #4B2E2E;
    border-radius: 10px;
    touch-action: none;
  }
  input, button {
    padding: 10px 15px;
    font-size: 16px;
    border-radius: 8px;
    border: 2px solid #4B2E2E;
    margin: 5px;
  }
  button {
    background-color: #4B2E2E;
    color: #F5E6D3;
    cursor: pointer;
  }
  button:hover {
    background-color: #3A1F1F;
  }
  #leaderboard {
    margin-top: 20px;
    color: #4B2E2E;
    text-align: center;
  }
</style>
</head>
<body>

<div class="container" id="startScreen">
  <h1>Enter Your Name</h1>
  <input type="text" id="username" placeholder="Your Name">
  <button onclick="startGame()">Start</button>
</div>

<canvas id="gameCanvas" width="360" height="600"></canvas>
<div id="leaderboard"></div>

<script>
// ===== Supabase Setup =====
const SUPABASE_URL = "https://cbeiddwkqrpmvuaqmcgn.supabase.co"; // Replace with your URL
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNiZWlkZHdrcXJwbXZ1YXFtY2duIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MDE3MzUsImV4cCI6MjA5NDI3NzczNX0.YWWX2vmejo_vqL4PkgdnxfCtiEaNsh3KMY1LFOacJsM"; // Replace with your anon key
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ===== Game Setup =====
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let cannon = { x: canvas.width/2 - 25, y: canvas.height - 50, width: 50, height: 30 };
let bullets = [];
let items = [];
let score = 0;
let timeLeft = 30;
let username = '';
let gameLoopId;
let itemIntervalId;
let timerIntervalId;
let autoShootIntervalId;
let dragging = false;

// ===== Start Game =====
function startGame() {
    username = document.getElementById('username').value.trim();
    if(!username) {
        alert("Please enter your name!");
        return;
    }

    document.getElementById('startScreen').style.display = 'none';
    canvas.style.display = 'block';
    score = 0;
    bullets = [];
    items = [];
    timeLeft = 30;

    canvas.addEventListener('touchstart', startDrag);
    canvas.addEventListener('touchmove', dragCannon);
    canvas.addEventListener('touchend', endDrag);

    autoShootIntervalId = setInterval(shootBullet, 400);
    itemIntervalId = setInterval(spawnItem, 1000);
    timerIntervalId = setInterval(() => {
        timeLeft--;
        if(timeLeft <= 0) endGame();
    }, 1000);

    gameLoop();
}

// ===== Drag Controls =====
function startDrag(e){ dragging = true; }
function dragCannon(e){
    if(dragging){
        const touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
        cannon.x = touchX - cannon.width/2;
        if(cannon.x < 0) cannon.x = 0;
        if(cannon.x + cannon.width > canvas.width) cannon.x = canvas.width - cannon.width;
        e.preventDefault();
    }
}
function endDrag(e){ dragging = false; }

// ===== Bullets =====
function shootBullet(){
    bullets.push({ x: cannon.x + cannon.width/2 - 5, y: cannon.y, width: 10, height: 20 });
}

// ===== Falling Items =====
function spawnItem(){
    let type = Math.random() < 0.5 ? 'good' : 'bomb';
    let x = Math.random() * (canvas.width - 30);
    items.push({ x, y:0, width:30, height:30, type });
}

// ===== Collision =====
function checkCollision(a, b){
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
}

// ===== Update Game =====
function update(){
    bullets.forEach(b => b.y -= 8);
    bullets = bullets.filter(b => b.y + b.height > 0);

    items.forEach(i => i.y += 3);
    items = items.filter(i => i.y < canvas.height);

    bullets.forEach((b, bi) => {
        items.forEach((i, ii) => {
            if(checkCollision(b, i)){
                score += i.type === 'good' ? 1 : -1;
                bullets.splice(bi,1);
                items.splice(ii,1);
            }
        });
    });
}

// ===== Draw Game =====
function draw(){
    ctx.clearRect(0,0,canvas.width, canvas.height);

    // Cannon
    ctx.fillStyle = "#4B2E2E";
    ctx.fillRect(cannon.x, cannon.y, cannon.width, cannon.height);

    // Bullets
    ctx.fillStyle = "#4B2E2E";
    bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

    // Items
    items.forEach(i => {
        ctx.fillStyle = i.type==='good' ? "#8BC34A" : "#FF5252";
        ctx.fillRect(i.x, i.y, i.width, i.height);
    });

    // Score and Timer
    ctx.fillStyle = "#4B2E2E";
    ctx.font = "18px Arial";
    ctx.fillText(`Player: ${username}`, 10, 20);
    ctx.fillText(`Score: ${score}`, 10, 40);
    ctx.fillText(`Time: ${timeLeft}s`, 10, 60);
}

// ===== Game Loop =====
function gameLoop(){
    update();
    draw();
    gameLoopId = requestAnimationFrame(gameLoop);
}

// ===== End Game =====
async function endGame(){
    cancelAnimationFrame(gameLoopId);
    clearInterval(itemIntervalId);
    clearInterval(timerIntervalId);
    clearInterval(autoShootIntervalId);

    alert(`Time's up! ${username}, your final score is ${score}`);

    // Save score to Supabase
    await saveScore(username, score);

    // Show leaderboard
    await showLeaderboard();

    location.reload(); // reload for new game
}

// ===== Save Score =====
async function saveScore(name, score){
    const { data, error } = await supabase
        .from('scores')
        .insert([{ name, score }]);

    if(error) console.error("Error saving score:", error);
    else console.log("Score saved:", data);
}

// ===== Fetch Leaderboard =====
async function fetchTopScores(){
    const { data, error } = await supabase
        .from('scores')
        .select('name, score')
        .order('score', { ascending: false })
        .limit(5);

    if(error){
        console.error("Error fetching leaderboard:", error);
        return [];
    }
    return data;
}

async function showLeaderboard(){
    const topScores = await fetchTopScores();
    let html = "<h2>Leaderboard</h2><ol>";
    topScores.forEach(s => { html += `<li>${s.name}: ${s.score}</li>`; });
    html += "</ol>";
    document.getElementById("leaderboard").innerHTML = html;
}
</script>
</body>
</html>
